name: Sync Vitessio

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout forked repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.base_ref }} #TODO: make sure this checks out main-2025-q2
          persist-credentials: 'false'

      # - name: Set up git user
      #TODO: Do we really need this?
      #  run: |
      #   git config user.name "github-actions[bot]"
      #    git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: git remote add upstream https://github.com/vitessio/vitess.git

      - name: Fetch upstream changes
        run: git fetch upstream

      - name: Merge upstream main into fork main
        run: git merge vitessio/main --ff

      - name: Push changes to forked repo
      #TODO: parameterize this, but first make sure it's sending to the right branch
        run: |
          git push origin main-2025-q2
        env:
          # PAT should have repo write access. Store it as a repo secret (e.g., GH_TOKEN)
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
